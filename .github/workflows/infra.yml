name: Infra CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform-check:
    name: Terraform Format, Plan & Apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ap-southeast-1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.11"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform (offline validation fallback)
        if: env.AWS_ACCESS_KEY_ID == ''
        run: terraform init -backend=false

      - name: Configure AWS Credentials
        if: env.AWS_ACCESS_KEY_ID != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Initialize Terraform (S3 remote backend)
        if: env.AWS_ACCESS_KEY_ID != ''
        run: terraform init -input=false

      - name: Validate Terraform configuration
        run: terraform validate

      - name: Run Terraform Plan on Pull Request
        id: plan
        if: env.AWS_ACCESS_KEY_ID != '' && github.event_name == 'pull_request'
        run: |
          set +e
          terraform plan -no-color -input=false -out=tfplan > raw_plan.txt 2>&1
          PLAN_EXIT=$?
          set -e

          # Redact AWS ARNs, ECR registry URLs, and 12-digit Account IDs before logging or commenting
          sed -E \
            -e "s/arn:aws:[a-zA-Z0-9_-]+:[a-z0-9-]*:[0-9]{12}:[^]\"' \t]+/arn:aws:<REDACTED>/g" \
            -e "s/[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/<ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/g" \
            -e "s/(^|[^0-9])[0-9]{12}([^0-9]|$)/\1<ACCOUNT_ID>\2/g" \
            raw_plan.txt > plan_output.txt
          rm -f raw_plan.txt

          echo "plan_exit=${PLAN_EXIT}" >> $GITHUB_OUTPUT
          cat plan_output.txt
          exit ${PLAN_EXIT}

      - name: Comment Terraform Plan on Pull Request
        if: always() && env.AWS_ACCESS_KEY_ID != '' && github.event_name == 'pull_request' && steps.plan.outcome != 'skipped'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'infra/plan_output.txt';
            if (!fs.existsSync(path)) return;

            const sanitize = (text) =>
              text
                .replace(/arn:aws:[a-zA-Z0-9_-]+:[a-z0-9-]*:\d{12}:[^\s"'\]]+/g, 'arn:aws:<REDACTED>')
                .replace(/\d{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/g, '<ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com')
                .replace(/\b\d{12}\b/g, '<ACCOUNT_ID>');

            const raw = sanitize(fs.readFileSync(path, 'utf8'));
            const isSuccess = '${{ steps.plan.outcome }}' === 'success';
            const lines = raw.split('\n');

            let summaryText = raw;
            if (isSuccess) {
              const filtered = lines.filter(
                (line) => /^\s*#\s+(aws_|data\.|module\.)/.test(line) || /^(Plan:|No changes\.)/.test(line)
              );
              summaryText = filtered.length > 0 ? filtered.join('\n') : 'No changes. Your infrastructure matches the configuration.';
            }

            const maxLen = 60000;
            const truncated = summaryText.length > maxLen ? summaryText.slice(-maxLen) + '\n... (truncated)' : summaryText;
            const status = isSuccess ? '✅ Passed' : '❌ Failed';
            const marker = '<!-- terraform-plan-comment -->';
            const body = `${marker}\n### 🏗️ Terraform Plan (${status})\n\`\`\`hcl\n${truncated}\n\`\`\``;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Run Terraform Apply on Main/Master Push
        if: env.AWS_ACCESS_KEY_ID != '' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: terraform apply -auto-approve -input=false
