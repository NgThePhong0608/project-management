name: CI/CD Pipeline

on:
  push:
    branches: ["main", "master", "feat/**", "fix/**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  backend-lint:
    name: PHP Lint (Pint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, ctype, iconv
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run Pint (Check style)
        run: ./vendor/bin/pint --test

  frontend-lint:
    name: Frontend Lint (Prettier)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install NPM Dependencies
        run: npm ci

      - name: Run Prettier check
        run: npm run lint

  tests:
    name: Run Tests & Build
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend-lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, sqlite, pdo_sqlite, gd, fileinfo
          coverage: none

      - name: Prepare Environment
        run: |
          cp .env.example .env
          sed -i 's/FILESYSTEM_DISK=.*/FILESYSTEM_DISK=public/' .env

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Generate App Key
        run: php artisan key:generate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Frontend Assets
        run: npm run build

      - name: Run PHPUnit Tests
        run: php artisan test

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [tests]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Frontend Assets
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push PHP App image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/php/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/project-management:app
            ${{ secrets.DOCKERHUB_USERNAME }}/project-management:app-${{ github.sha }}

      - name: Build and push Nginx image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/nginx/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/project-management:nginx
            ${{ secrets.DOCKERHUB_USERNAME }}/project-management:nginx-${{ github.sha }}

  deploy:
    name: Deploy to Amazon ECS
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Trigger ECS Service Deployment
        run: |
          echo "Triggering new deployment on Amazon ECS (pm-cluster / pm-service)..."
          aws ecs update-service \
            --cluster pm-cluster \
            --service pm-service \
            --force-new-deployment

      - name: Wait for ECS Service to reach steady state
        run: |
          echo "Waiting for ECS service to stabilize..."
          aws ecs wait services-stable \
            --cluster pm-cluster \
            --services pm-service
          echo "Deployment to Amazon ECS completed successfully!"

