name: CI/CD Pipeline

on:
  push:
    branches: ["main", "master", "feat/**", "fix/**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  backend-lint:
    name: PHP Lint (Pint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, xml, ctype, iconv
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run Pint (Check style)
        run: ./vendor/bin/pint --test

  frontend-lint:
    name: Frontend Lint (Prettier)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install NPM Dependencies
        run: npm ci

      - name: Run Prettier check
        run: npm run lint

  tests:
    name: Run Tests & Build
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend-lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, sqlite, pdo_sqlite, gd, fileinfo
          coverage: none

      - name: Prepare Environment
        run: |
          cp .env.example .env
          sed -i 's/FILESYSTEM_DISK=.*/FILESYSTEM_DISK=public/' .env

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Generate App Key
        run: php artisan key:generate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Frontend Assets
        run: npm run build

      - name: Run PHPUnit Tests
        run: php artisan test

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [tests]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Frontend Assets
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push PHP App image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/php/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/project-management:app
            ${{ secrets.DOCKERHUB_USERNAME }}/project-management:app-${{ github.sha }}

      - name: Build and push Nginx image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/nginx/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/project-management:nginx
            ${{ secrets.DOCKERHUB_USERNAME }}/project-management:nginx-${{ github.sha }}

  deploy:
    name: Deploy to Amazon ECS
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Trigger ECS Deployment & Validate Rollout
        run: |
          echo "🚀 Triggering new deployment on Amazon ECS (pm-cluster / pm-service)..."
          
          # 1. Trigger deployment and capture the newly created deployment ID
          DEPLOYMENT_ID=$(aws ecs update-service \
            --cluster pm-cluster \
            --service pm-service \
            --force-new-deployment \
            --query "service.deployments[?status=='PRIMARY'].id" \
            --output text)

          echo "Deployment ID: $DEPLOYMENT_ID"

          # 2. Wait 15s for ECS to register the new deployment and transition state
          echo "Waiting 15s for ECS to register rollout..."
          sleep 15

          # 3. Wait for service to reach steady state
          echo "Waiting for service to stabilize..."
          aws ecs wait services-stable \
            --cluster pm-cluster \
            --services pm-service || true

          # 4. Inspect rolloutState of the targeted deployment
          DEPLOY_INFO=$(aws ecs describe-services \
            --cluster pm-cluster \
            --services pm-service \
            --query "services[0].deployments[?id=='$DEPLOYMENT_ID'].[rolloutState, rolloutStateReason]" \
            --output text)

          ROLLOUT_STATE=$(echo "$DEPLOY_INFO" | awk '{print $1}')
          ROLLOUT_REASON=$(echo "$DEPLOY_INFO" | cut -d' ' -f2-)

          echo "Rollout State: $ROLLOUT_STATE"
          if [ -n "$ROLLOUT_REASON" ]; then
            echo "Reason: $ROLLOUT_REASON"
          fi

          # 5. If deployment failed or did not reach COMPLETED -> print recent ECS events and fail pipeline
          if [ "$ROLLOUT_STATE" = "FAILED" ] || [ -z "$ROLLOUT_STATE" ]; then
            echo "❌ Deployment FAILED! Printing recent ECS service events:"
            aws ecs describe-services \
              --cluster pm-cluster \
              --services pm-service \
              --query "services[0].events[:6].[createdAt, message]" \
              --output table
            exit 1
          fi

          echo "✅ Deployment to Amazon ECS COMPLETED successfully!"


