name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "feat/**", "fix/**" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-lint:
    name: PHP Lint (Pint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run Pint (Check style)
        run: ./vendor/bin/pint --test

  frontend-lint:
    name: Frontend Lint (Prettier)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Run Prettier check
        run: npm run lint

  tests:
    name: Run Tests & Build
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend-lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, sqlite, pdo_sqlite, gd, fileinfo
          coverage: none

      - name: Prepare Environment
        run: |
          cp .env.example .env
          sed -i 's/FILESYSTEM_DISK=.*/FILESYSTEM_DISK=public/' .env

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Generate App Key
        run: php artisan key:generate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Frontend Assets
        run: npm run build

      - name: Run PHPUnit Tests
        run: php artisan test

      # Đóng gói thư mục build frontend để deploy
      - name: Upload Built Frontend Assets
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: public/build/
          retention-days: 1

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: [tests]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Pull code mới và chuẩn bị .env trên EC2 trước
      - name: Prepare Code and Environment on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          timeout: 10m
          script: |
            set -e
            echo "Pulling latest code on EC2..."
            cd ~/project-management
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}

            echo "Fetching environment variables from AWS SSM Parameter Store..."
            aws ssm get-parameter \
              --region ap-southeast-1 \
              --name "/pm-app/dev/env" \
              --with-decryption \
              --query "Parameter.Value" \
              --output text > .env

            sed -i "s#APP_URL=.*#APP_URL=http://$(curl -s http://checkip.amazonaws.com):8088#" .env

      # 2. Tải asset từ job test về runner
      - name: Download Built Frontend Assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: build/

      # 3. SCP trực tiếp vào project-management/public/build trên EC2
      - name: Copy Frontend Assets to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/*"
          target: "~/project-management/public/"

      # 4. Khởi chạy Docker containers trên EC2
      - name: Restart Containers on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          timeout: 10m
          script: |
            set -e
            cd ~/project-management
            echo "Starting Docker containers..."
            docker compose up -d --build
            echo "Deployment completed successfully!"
