name: CI/CD Pipeline

on:
  push:
    branches:
      - "main"
      - "master"
  pull_request:
    branches: ["main", "master"]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  # =========================================================================
  # STAGE 1: Check convention / Lint / Test
  # =========================================================================
  check-convention-lint-test:
    name: Check convention / Lint / Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, sqlite, pdo_sqlite, gd, fileinfo, xml, ctype, iconv
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Prepare Environment
        run: |
          cp .env.example .env
          sed -i 's/FILESYSTEM_DISK=.*/FILESYSTEM_DISK=public/' .env

      - name: Install Dependencies
        run: |
          composer install --prefer-dist --no-progress --no-interaction
          npm ci
          php artisan key:generate

      - name: Check Backend Convention (Pint)
        run: ./vendor/bin/pint --test

      - name: Check Frontend Code Style (Prettier)
        run: npm run lint

      - name: Build Frontend Assets
        run: npm run build

      - name: Run Unit & Feature Tests
        run: php artisan test

  # =========================================================================
  # STAGE 2: Build Docker Image
  # =========================================================================
  build-docker-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [check-convention-lint-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Production Frontend Assets
        run: npm run build
        env:
          VITE_APP_NAME: ${{ secrets.VITE_APP_NAME }}
          VITE_REVERB_APP_KEY: ${{ secrets.VITE_REVERB_APP_KEY }}
          VITE_REVERB_HOST: ${{ secrets.VITE_REVERB_HOST }}
          VITE_REVERB_PORT: ${{ secrets.VITE_REVERB_PORT }}
          VITE_REVERB_SCHEME: ${{ secrets.VITE_REVERB_SCHEME }}

      - name: Build Docker Images (PHP App & Nginx)
        run: |
          echo "🔨 Building pm-app image..."
          docker build -t pm-app:${{ github.sha }} -t pm-app:latest -f ./docker/php/Dockerfile.prod .
          
          echo "🔨 Building pm-nginx image..."
          docker build -t pm-nginx:${{ github.sha }} -t pm-nginx:latest -f ./docker/nginx/Dockerfile.prod .

          echo "📦 Archiving Docker images for push stage..."
          mkdir -p /tmp/docker-images
          docker save pm-app:${{ github.sha }} pm-app:latest pm-nginx:${{ github.sha }} pm-nginx:latest | gzip > /tmp/docker-images/images.tar.gz

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-images-${{ github.sha }}
          path: /tmp/docker-images/images.tar.gz
          retention-days: 1

  # =========================================================================
  # STAGE 3: Push image lên ECR với tag commit SHA
  # =========================================================================
  push-image-ecr:
    name: Push image lên ECR với tag commit SHA
    runs-on: ubuntu-latest
    needs: [build-docker-image]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-images-${{ github.sha }}
          path: /tmp/docker-images

      - name: Load & Tag Images for Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "📦 Unpacking Docker images..."
          gunzip -c /tmp/docker-images/images.tar.gz | docker load

          echo "🏷️ Tagging images with commit SHA (${{ github.sha }}) and latest..."
          docker tag pm-app:${{ github.sha }} $ECR_REGISTRY/pm-app:${{ github.sha }}
          docker tag pm-app:latest $ECR_REGISTRY/pm-app:latest
          docker tag pm-nginx:${{ github.sha }} $ECR_REGISTRY/pm-nginx:${{ github.sha }}
          docker tag pm-nginx:latest $ECR_REGISTRY/pm-nginx:latest

          echo "🚀 Pushing pm-app to Amazon ECR..."
          docker push $ECR_REGISTRY/pm-app:${{ github.sha }}
          docker push $ECR_REGISTRY/pm-app:latest

          echo "🚀 Pushing pm-nginx to Amazon ECR..."
          docker push $ECR_REGISTRY/pm-nginx:${{ github.sha }}
          docker push $ECR_REGISTRY/pm-nginx:latest
          echo "✅ Pushed images to ECR successfully."

  # =========================================================================
  # STAGE 4: Register new Task Definition
  # =========================================================================
  register-task-definition:
    name: Register new Task Definition
    runs-on: ubuntu-latest
    needs: [push-image-ecr]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    outputs:
      task_def_arn: ${{ steps.render-task-def.outputs.task_def_arn }}
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Sync .env from SSM Parameter Store to EC2 Node
        run: |
          echo "🔄 Syncing .env from SSM Parameter Store (/pm-app/dev/env) to EC2 host..."
          
          CONTAINER_INSTANCE_ARN=$(aws ecs list-container-instances \
            --cluster pm-cluster \
            --query "containerInstanceArns[0]" \
            --output text)
          
          if [ -n "$CONTAINER_INSTANCE_ARN" ] && [ "$CONTAINER_INSTANCE_ARN" != "None" ]; then
            INSTANCE_ID=$(aws ecs describe-container-instances \
              --cluster pm-cluster \
              --container-instances "$CONTAINER_INSTANCE_ARN" \
              --query "containerInstances[0].ec2InstanceId" \
              --output text)
            
            echo "Target EC2 Instance: $INSTANCE_ID"
            
            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "Sync .env from SSM to /home/ec2-user/.env" \
              --parameters 'commands=["aws ssm get-parameter --region ap-southeast-1 --name /pm-app/dev/env --with-decryption --query Parameter.Value --output text > /home/ec2-user/.env", "chown ec2-user:ec2-user /home/ec2-user/.env", "chmod 644 /home/ec2-user/.env"]' \
              --query "Command.CommandId" \
              --output text)
            
            echo "SSM Command dispatched: $COMMAND_ID. Waiting for execution..."
            aws ssm wait command-executed \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID"
            
            echo "✅ Successfully synced latest .env to /home/ec2-user/.env on $INSTANCE_ID"
          else
            echo "⚠️ No active container instance found in pm-cluster. Skipping SSM sync."
          fi

      - name: Render and Register Task Definition revision
        id: render-task-def
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "📝 Rendering new Task Definition for pm-task with SHA: ${{ github.sha }}..."
          
          aws ecs describe-task-definition \
            --task-definition pm-task \
            --query "taskDefinition" | \
            jq --arg APP_IMAGE "$ECR_REGISTRY/pm-app:${{ github.sha }}" \
               --arg NGINX_IMAGE "$ECR_REGISTRY/pm-nginx:${{ github.sha }}" \
               'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy) |
                .containerDefinitions = (.containerDefinitions | map(
                  if .name == "app" then .image = $APP_IMAGE
                  elif .name == "nginx" then .image = $NGINX_IMAGE
                  else . end
                ))' > task-def-${{ github.sha }}.json
          
          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-def-${{ github.sha }}.json \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)
          
          echo "✅ Registered new Task Definition: $NEW_TASK_DEF_ARN"
          echo "task_def_arn=$NEW_TASK_DEF_ARN" >> $GITHUB_OUTPUT

  # =========================================================================
  # STAGE 5: Update ECS Service
  # =========================================================================
  update-ecs-service:
    name: Update ECS Service
    runs-on: ubuntu-latest
    needs: [register-task-definition]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    outputs:
      deployment_id: ${{ steps.update-service.outputs.deployment_id }}
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Trigger Rolling ECS Service Update
        id: update-service
        run: |
          NEW_TASK_DEF_ARN="${{ needs.register-task-definition.outputs.task_def_arn }}"
          echo "🚀 Updating Amazon ECS service (pm-cluster / pm-service) to new revision: $NEW_TASK_DEF_ARN..."
          
          DEPLOYMENT_ID=$(aws ecs update-service \
            --cluster pm-cluster \
            --service pm-service \
            --task-definition "$NEW_TASK_DEF_ARN" \
            --query "service.deployments[?status=='PRIMARY'].id" \
            --output text)

          echo "Deployment ID: $DEPLOYMENT_ID"
          echo "deployment_id=$DEPLOYMENT_ID" >> $GITHUB_OUTPUT

  # =========================================================================
  # STAGE 6: Wait và kiểm tra deployment status
  # =========================================================================
  wait-and-verify-deployment:
    name: Wait và kiểm tra deployment status
    runs-on: ubuntu-latest
    needs: [update-ecs-service]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Wait for Steady State & Validate Rollout
        run: |
          DEPLOYMENT_ID="${{ needs.update-ecs-service.outputs.deployment_id }}"
          echo "⏳ Monitoring deployment $DEPLOYMENT_ID for pm-service..."

          echo "Waiting 15s for ECS to register rollout..."
          sleep 15

          echo "Waiting for service to stabilize..."
          aws ecs wait services-stable \
            --cluster pm-cluster \
            --services pm-service || true

          DEPLOY_INFO=$(aws ecs describe-services \
            --cluster pm-cluster \
            --services pm-service \
            --query "services[0].deployments[?id=='$DEPLOYMENT_ID'].[rolloutState, rolloutStateReason]" \
            --output text)

          ROLLOUT_STATE=$(echo "$DEPLOY_INFO" | awk '{print $1}')
          ROLLOUT_REASON=$(echo "$DEPLOY_INFO" | cut -d' ' -f2-)

          echo "Rollout State: $ROLLOUT_STATE"
          if [ -n "$ROLLOUT_REASON" ]; then
            echo "Reason: $ROLLOUT_REASON"
          fi

          if [ "$ROLLOUT_STATE" = "FAILED" ] || [ -z "$ROLLOUT_STATE" ]; then
            echo "❌ Deployment FAILED! Printing recent ECS service events:"
            aws ecs describe-services \
              --cluster pm-cluster \
              --services pm-service \
              --query "services[0].events[:6].[createdAt, message]" \
              --output table
            exit 1
          fi

          echo "✅ Deployment to Amazon ECS COMPLETED successfully!"

      - name: Clean up Stale CloudWatch Log Streams & Set Retention
        run: |
          echo "🧹 Setting log retention to 7 days and cleaning up old log streams in /pm-app/dev..."
          aws logs put-retention-policy --log-group-name "/pm-app/dev" --retention-in-days 7 || true

          OLD_STREAMS=$(aws logs describe-log-streams \
            --log-group-name "/pm-app/dev" \
            --order-by LastEventTime \
            --descending \
            --query "logStreams[?logStreamName!='notifications'].logStreamName" \
            --output text | tr '\t' '\n' | tail -n +7)

          for STREAM in $OLD_STREAMS; do
            if [ -n "$STREAM" ]; then
              echo "Deleting old log stream: $STREAM"
              aws logs delete-log-stream --log-group-name "/pm-app/dev" --log-stream-name "$STREAM" || true
            fi
          done
          echo "✅ CloudWatch log streams cleanup complete."
