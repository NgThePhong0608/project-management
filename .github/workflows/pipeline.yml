name: CI/CD Pipeline

on:
  push:
    branches:
      - "main"
      - "master"
  pull_request:
    branches: ["main", "master"]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            infra:
              - "infra/**"
            app:
              - "**"
              - "!infra/**"
              - "!**.md"

  infra-ci:
    name: Infra CI
    needs: [detect-changes]
    if: needs.detect-changes.outputs.infra == 'true'
    uses: ./.github/workflows/infra.yml

  app-cicd:
    name: App CI/CD
    needs: [detect-changes, infra-ci]
    # Run after infra-ci succeeds, or immediately if infra-ci was skipped
    if: |
      always() &&
      needs.detect-changes.outputs.app == 'true' &&
      (needs.infra-ci.result == 'success' || needs.infra-ci.result == 'skipped')
    uses: ./.github/workflows/ci.yml
    secrets: inherit

